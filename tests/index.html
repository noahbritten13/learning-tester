<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Tester tests</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --text: #1d1d1f; --ok: #2f7d4f; --bad: #b8432f; --muted: #6b6b70; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141517; --text: #ececec; --ok: #6fcf97; --bad: #ee7b68; --muted: #9a9ca1; } }
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: var(--bg); color: var(--text); }
    h1 { font-size: 1.2rem; }
    .pass { color: var(--ok); }
    .fail { color: var(--bad); font-weight: 600; }
    .err { color: var(--bad); white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 13px; margin: 2px 0 10px 18px; }
    #summary { font-weight: 700; margin-bottom: 12px; }
    h2 { font-size: 1rem; margin: 18px 0 4px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Learning Tester: automated tests</h1>
  <div id="summary">Running…</div>
  <div id="out"></div>
  <script type="module" src="tests.js"></script>
</body>
</html>
